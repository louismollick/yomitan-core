name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - next

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup npm
        run: npm install --global npm@^11.5.1

      - name: Install dependencies
        run: npm ci

      - name: Install browser test engines
        run: npx playwright install --with-deps chromium webkit

      - name: Install Hermes CLI
        run: npx --yes jsvu@2 --os=linux64 --engines=hermes

      - name: Check vendored upstream is in sync
        run: |
          npm run sync-upstream
          changes="$(git status --porcelain --untracked-files=all -- packages/core/src/upstream packages/contract-tests/fixtures)"
          if [ -n "$changes" ]; then
            echo "Vendored upstream is out of sync with upstream.config.json:"
            echo "$changes"
            exit 1
          fi

      - name: Verify
        env:
          REQUIRE_HERMES: '1'
          HERMES_BIN: /home/runner/.jsvu/bin/hermes
        run: npm run verify

      - name: React Native adapter contracts
        run: npm run test -w @yomitan-core/react-native
